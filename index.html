<html lang="en">

    <meta charset="UTF-8" />

    <!-- Favicon: suguru geto -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />

    <!-- Title -->
    <title>prathamesh anvekar</title>

    <!-- Theme flash prevention -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
        }
      })();
    </script>

    <!-- Primary SEO -->
    <meta name="description" content="Prathamesh Anvekar — backend & AI developer from Pune, India. Building practical, performant software in Go, Python, and TypeScript." />
    <meta name="keywords" content="Prathamesh Anvekar, backend developer, AI developer, Go, Python, TypeScript, FastAPI, portfolio, Pune" />
    <meta name="author" content="Prathamesh Anvekar" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfbfa" media="(prefers-color-scheme: light)" />

    <!-- Open Graph (social previews — uses profile photo) -->
